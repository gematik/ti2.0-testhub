x-popp-no-proxy-env: &popp-no-proxy-env
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: "localhost,127.0.0.1,popp-zeta-ingress,popp-zeta-pep,popp-zeta-pdp,popp-zeta-pdp-opa,popp-server"

services:
  popp-token-generator:
    container_name: popp-token-generator
    platform: linux/amd64
    image: gematik1/popp-token-generator:1.0.12
    env_file:
      - path: ../.env
        required: true
    ports:
      - "${PORT_POPP_TOKEN_GENERATOR:?PORT_POPP_TOKEN_GENERATOR missing – set it in doc/docker/.env}:80"
    environment:
      - SPRING_PROFILES_ACTIVE=beispielimpl
    networks:
      - testhub_network

  popp-client:
    profiles: [ "full" ]
    container_name: popp-client
    image: gematik1/popp-client:2.7.1
    env_file:
      - path: ../.env
        required: true
    platform: linux/amd64
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - POPP_SERVER_URL=${POPP_SERVER_URL:-wss://popp-zeta-ingress:443/popp/practitioner/api/v1/token-generation-ehc}
      - SPRING_PROFILES_ACTIVE=dev
      - VIRTUAL_CARD_IMAGE_FILE=${VIRTUAL_CARD_IMAGE_PATH:-/data/cards}/${VIRTUAL_CARD_IMAGE_FILE:-egkCardImage.xml}
      - ZETA_AUTHENTICATION_SMB_KEYFILE=${ZETA_AUTHENTICATION_SMB_KEYFILE:-/app/smcb_private.p12}
      # Konnektor address (event-service endpoint) and terminal context – only used when a
      # request specifies "communicationType": "contact-connector"/"contactless-connector".
      # The PoPP-Client selects the SMC-B source (keystore vs. Konnektor) per request, so both
      # can be configured on the same container at the same time, see
      # https://github.com/gematik/popp-sample-code/blob/main/README.md#b-konnektor
      # Override the placeholder defaults below via doc/docker/env-private/.my-own.env to point
      # at a real Konnektor.
      - CONNECTOR_END_POINT_URL=${CONNECTOR_END_POINT_URL:-https://<Konnektor-IP-oder-Host>:<Port>}
      - CONNECTOR_SECURE_ENABLE=${CONNECTOR_SECURE_ENABLE:-true}
      - CONNECTOR_SECURE_HOSTNAME_VALIDATION=${CONNECTOR_SECURE_HOSTNAME_VALIDATION:-false}
      - CONNECTOR_SECURE_KEYSTORE=${CONNECTOR_SECURE_KEYSTORE:-/app/connector/keystore.p12}
      - CONNECTOR_SECURE_KEYSTORE_PASSWORD=${CONNECTOR_SECURE_KEYSTORE_PASSWORD:-changeit}
      - CONNECTOR_SECURE_TRUST_ALL=${CONNECTOR_SECURE_TRUST_ALL:-false}
      - CONNECTOR_SECURE_TRUSTSTORE=${CONNECTOR_SECURE_TRUSTSTORE:-/app/connector/truststore.p12}
      - CONNECTOR_SECURE_TRUSTSTORE_PASSWORD=${CONNECTOR_SECURE_TRUSTSTORE_PASSWORD:-changeit}
      - CONTEXT_CLIENT_SYSTEM_ID=${CONTEXT_CLIENT_SYSTEM_ID:-C1}
      - CONTEXT_WORKPLACE_ID=${CONTEXT_WORKPLACE_ID:-W1}
      - CONTEXT_MANDANT_ID=${CONTEXT_MANDANT_ID:-M1}
      - CARD_TERMINAL_ID=${CARD_TERMINAL_ID:-}
      - CARD_TERMINAL_SLOT=${CARD_TERMINAL_SLOT:-}
      # - JAVA_TOOL_OPTIONS="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5013"
      - JAVA_TOOL_OPTIONS=${POPP_JAVA_TOOL_OPTIONS:-}
    networks:
      - testhub_network
    ports:
      - "${PORT_POPP_CLIENT:?PORT_POPP_CLIENT missing – set it in doc/docker/.env}:8081"
      - "${PORT_POPP_CLIENT_MGMT:?PORT_POPP_CLIENT_MGMT missing – set it in doc/docker/.env}:9001"
    volumes:
      - ./zeta/smcb-private/${SMCB_FILE:-smcb_private.p12}:/app/smcb_private.p12:ro
      - ${CONNECTOR_KEYSTORE_DIR:-./zeta/connector}/${CONNECTOR_KEYSTORE_FILE:-keystore.p12}:/app/connector/keystore.p12:ro
      - ${CONNECTOR_TRUSTSTORE_DIR:-./zeta/connector}/${CONNECTOR_TRUSTSTORE_FILE:-truststore.p12}:/app/connector/truststore.p12:ro
      - ../../../test/vsdm-testsuite/src/test/resources/data/cards:/data/cards
      - type: volume
        source: dns-config
        target: /etc/resolv.conf
        read_only: true
        volume:
          subpath: resolv.conf
      - ../../../test/vsdm-testsuite/src/test/resources/${VIRTUAL_CARD_IMAGE_PATH:-data/cards}:${VIRTUAL_CARD_IMAGE_PATH:-/data/cards}:ro
      - ../../../no-publish/test-data/erp:/mnt/:ro
    depends_on:
      otel-collector:
        condition: service_started
      resolv-writer:
        condition: service_completed_successfully

  popp-client-perf:
    profiles: [ "ps-only" ]
    container_name: popp-client
    image: gematik1/popp-client:2.7.1
    env_file:
      - path: ../.env
        required: true
    platform: linux/amd64
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - POPP_SERVER_URL=${POPP_SERVER_URL:-wss://popp-zeta-ingress:443/popp/practitioner/api/v1/token-generation-ehc}
      - SPRING_PROFILES_ACTIVE=dev
      - VIRTUAL_CARD_IMAGE_FILE=${VIRTUAL_CARD_IMAGE_PATH:-/data/cards}/${VIRTUAL_CARD_IMAGE_FILE:-egkCardImage.xml}
      - ZETA_AUTHENTICATION_SMB_KEYFILE=/app/smcb_private.p12
      # - JAVA_TOOL_OPTIONS="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5013"
    networks:
      - testhub_network
    ports:
      - "${PORT_POPP_CLIENT:?PORT_POPP_CLIENT missing – set it in doc/docker/.env}:8081"
      - "${PORT_POPP_CLIENT_MGMT:?PORT_POPP_CLIENT_MGMT missing – set it in doc/docker/.env}:9001"
    volumes:
      - ./zeta/smcb-private/${SMCB_FILE:-smcb_private.p12}:/app/smcb_private.p12:ro
      - ../../../test/vsdm-testsuite/src/test/resources/data/cards:/data/cards
      - ../../../test/vsdm-testsuite/src/test/resources/${VIRTUAL_CARD_IMAGE_PATH:-data/cards}:${VIRTUAL_CARD_IMAGE_PATH:-/data/cards}:ro
    depends_on:
      otel-collector:
        condition: service_started

  popp-server:
    profiles: [ "full", "backend-only" ]
    image: gematik1/popp-server:2.7.1
    env_file:
      - path: ../.env
        required: true
    platform: linux/amd64
    container_name: popp-server
    ports:
      - "${PORT_POPP_SERVER:?PORT_POPP_SERVER missing – set it in doc/docker/.env}:8443"
    environment:
      - CERT_HASH_IMPORT_LOCATION=file:/app/import
      - IDENTITIES_LOCATION=classpath:identities
      - SPRING_DATASOURCE_URL=jdbc:postgresql://popp-server-db:5432/egk_hash_db
    networks:
      - testhub_network
    depends_on:
      - popp-server-db
      - otel-collector

  popp-server-db:
    profiles: [ "full", "backend-only" ]
    image: postgres:18-alpine
    pull_policy: if_not_present
    env_file:
      - path: ../.env
        required: true
    platform: linux/amd64
    container_name: popp-server-db
    environment:
      POSTGRES_DB: egk_hash_db
      POSTGRES_PASSWORD: verysafe
      POSTGRES_USER: poppserver
    ports:
      - "${PORT_POPP_SERVER_DB:?PORT_POPP_SERVER_DB missing – set it in doc/docker/.env}:5432"
    tmpfs:
      - /var/lib/postgresql
    restart: on-failure
    networks:
      - testhub_network

  popp-zeta-ingress:
    profiles: [ "full", "backend-only" ]
    container_name: popp-zeta-ingress
    platform: linux/amd64
    image: "nginx:1.29.7"
    pull_policy: if_not_present
    env_file:
      - path: ../.env
        required: true
    ports:
      - "${PORT_POPP_ZETA_INGRESS:?PORT_POPP_ZETA_INGRESS missing – set it in doc/docker/.env}:443"
    volumes:
      - ./zeta-popp/ingress/conf:/etc/nginx/conf.d:ro
      - ./zeta-popp/ingress/certs:/etc/nginx/certs:ro
    networks:
      - testhub_network
    depends_on:
      - popp-zeta-pep

  popp-zeta-pep:
    profiles: [ "full", "backend-only" ]
    image: europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/ngx_pep:1.2.0
    env_file:
      - path: ../.env
        required: true
    platform: linux/amd64
    environment:
      <<: *popp-no-proxy-env
      POPP_SERVER_HOST: popp-server:8443
    ports:
      - "${PORT_POPP_ZETA_PEP:?PORT_POPP_ZETA_PEP missing – set it in doc/docker/.env}:80"
    command: [ "nginx", "-g", "daemon off;", "-c", "/ci_nginx/nginx.conf" ]
    volumes:
      - ./zeta-popp/pep/conf/:/etc/nginx/templates/:ro
      - ./zeta-popp/pep:/ci_nginx:ro
      - ./zeta-popp/well-known/:/srv/.well-known/:ro
    networks:
      - testhub_network
    depends_on:
      popp-zeta-pdp:
        condition: service_healthy
      popp-server:
        condition: service_started # TODO: change to "service_healthy" when healthcheck is available

  popp-zeta-pdp:
    profiles: [ "full", "backend-only" ]
    image: europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/keycloak-zeta:1.2.3
    env_file:
      - path: ../.env
        required: true
    platform: linux/amd64
    environment:
      <<: *popp-no-proxy-env
      DEBUG_PORT: "*:5022"
      DEBUG: "true"
      GENESIS_HASH: "4841c2142fef441daa6ee6c57db65c011935964b14e94a6c8f5ec0447b83526c"
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB_PASSWORD: "keycloak_db_user_password"
      KC_DB: "postgres"
      KC_DB_SCHEMA: "public"
      KC_DB_URL: "jdbc:postgresql://popp-zeta-pdp-db:5432/keycloak?sslmode=disable"
      KC_DB_USERNAME: "keycloak_db_user"
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME: https://popp-zeta-ingress/auth/
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 80
      KC_HTTP_RELATIVE_PATH: /auth
      KC_LOG_LEVEL: INFO
      KC_PROXY_HEADERS: xforwarded
      KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_DECISION_PATH: "/v1/data/zeta/authz/decision"
      KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_OPA_BASE_URL: http://popp-zeta-pdp-opa:8181
      KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_OPA_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      PROXY_ADDRESS_FORWARDING: true
      SMCB_HASHING_PEPPER: "-085c1245-dc0d-4d39-95b4-97496bec6182"
      SMCB_KEYSTORE_LOCATION: /opt/keycloak/conf/smcb/truststore.p12
      SMCB_KEYSTORE_PASSWORD: "changeit"
      TPM_KEYSTORE_LOCATION: /opt/keycloak/conf/tpm/tpm-certificates.p12
      TPM_KEYSTORE_PASSWORD: "O3Bdel9P5+cOgzIGANkOPEzBQM3V"
    ports:
      - "${PORT_POPP_ZETA_PDP:?PORT_POPP_ZETA_PDP missing – set it in doc/docker/.env}:80"
      - "${PORT_POPP_ZETA_PDP_HEALTH:?PORT_POPP_ZETA_PDP_HEALTH missing – set it in doc/docker/.env}:9000"
      - "${PORT_POPP_ZETA_PDP_DEBUG:?PORT_POPP_ZETA_PDP_DEBUG missing – set it in doc/docker/.env}:5022"
    volumes:
      - ./zeta-popp/realm:/opt/keycloak/data/import
      - ./zeta-popp/smcb:/opt/keycloak/conf/smcb
      - ./zeta/tpm/:/opt/keycloak/conf/tpm
    networks:
      - testhub_network
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e \"GET /auth/health/live HTTP/1.1\r\nhost: localhost:9000\r\nConnection: close\r\n\r\n\" >&3;grep \"status.*UP\" <&3" ]
      start_period: 120s
      interval: 5s
      timeout: 5s
      retries: 30
    command: [ "start-dev","--import-realm" ]
    depends_on:
      - popp-zeta-pdp-db

  popp-zeta-pdp-db:
    profiles: [ "full", "backend-only" ]
    container_name: popp-zeta-pdp-db
    platform: linux/amd64
    image: postgres:16.2
    pull_policy: if_not_present
    env_file:
      - path: ../.env
        required: true
    ports:
      - "${PORT_POPP_ZETA_PDP_DB:?PORT_POPP_ZETA_PDP_DB missing – set it in doc/docker/.env}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - testhub_network
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: keycloak_db_user_password
      POSTGRES_USER: keycloak_db_user

  popp-zeta-pdp-opa:
    profiles: [ "full", "backend-only" ]
    container_name: popp-zeta-pdp-opa
    image: europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/opa:1.18.2-static
    env_file:
      - path: ../.env
        required: true
    platform: linux/amd64
    environment:
      <<: *popp-no-proxy-env
    ports:
      - "${PORT_POPP_ZETA_PDP_OPA:?PORT_POPP_ZETA_PDP_OPA missing – set it in doc/docker/.env}:8181"
    command:
      - 'run'
      - '--server'
      - '--log-level=debug'
      - '--addr=0.0.0.0:8181'
      - '/policies/authz.rego'
    volumes:
      - ./zeta-popp/policies:/policies:ro
    networks:
      - testhub_network

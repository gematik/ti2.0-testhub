name: "testhub-${ENV_NAME:-local}"

include:
  - path: ./backend/compose-backend.yaml
    project_directory: ./backend

x-no-proxy-env: &no-proxy-env
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""

# ==================== Services ====================

services:
  card-terminal-client-base:
    container_name: card-terminal-client
    image: testhub/card-terminal-client-simservice:local
    build:
      context: ../../client/card-terminal-client-simservice
      dockerfile: docker/Dockerfile
    profiles: [ "abstract" ]
    env_file:
      - path: .env
        required: true
    environment:
      <<: *no-proxy-env
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "${PORT_CARD_TERMINAL_CLIENT:?PORT_CARD_TERMINAL_CLIENT missing – set it in infra/docker/.env}:80"
      - "${PORT_CARD_TERMINAL_CLIENT_DEBUG:?PORT_CARD_TERMINAL_CLIENT_DEBUG missing – set it in infra/docker/.env}:5005"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/service/status" ]
      interval: 10s
      timeout: 10s
      retries: 3

  vsdm-client-base:
    container_name: vsdm-client
    image: testhub/vsdm-client-simservice:local
    build:
      context: ../../client/vsdm-client-simservice-java
      dockerfile: docker/Dockerfile
    profiles: [ "abstract" ]
    env_file:
      - path: .env
        required: true
    environment:
      <<: *no-proxy-env
      VSDM_USE_MOCK_POPP_TOKEN: ${VSDM_USE_MOCK_POPP_TOKEN:-true}
      INTERCEPT_STORAGE: ${INTERCEPT_STORAGE:-true}
      POPP_HTTP_URL: http://popp-client:8081/token
      POPP_TOKEN_GENERATOR_URL: http://popp-token-generator:80
      VSDM_DISABLE_SERVER_VALIDATION: ${VSDM_DISABLE_SERVER_VALIDATION:-true}
      VSDM_RESOURCE_SERVER_URL: ${VSDM_RESOURCE_SERVER_URL:-https://vsdm-zeta-ingress}
      OTEL_SERVICE_NAME: vsdm-client
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006 -Dsun.net.inetaddr.ttl=0 -Dsun.net.inetaddr.negative.ttl=0
      ZETASDK_SMCB_ALIAS: alias
      ZETASDK_SMCB_PRIVATE_KEY_PASSWORD: "00"
      ZETASDK_SMCB_PRIVATE_KEY_PATH: /tmp/zeta/smcb_private.p12
    ports:
      - "${PORT_VSDM_CLIENT:?PORT_VSDM_CLIENT missing – set it in infra/docker/.env}:80"
      - "${PORT_VSDM_CLIENT_DEBUG:?PORT_VSDM_CLIENT_DEBUG missing – set it in infra/docker/.env}:5006"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/service/status" ]
      interval: 10s
      timeout: 10s
      retries: 3

  # Resolves the Canopy container's IP via Docker DNS and writes it as the
  # sole nameserver into a shared Docker volume, which client containers mount
  # as /etc/resolv.conf. This ensures Canopy is queried first for all DNS.
  resolv-writer:
    image: alpine:3
    profiles: [ "full", "ps-only", "backend-only" ]
    command: [ "sh", "-c", "printf '# generated by resolv-writer on %s\n' \"$(date -Iseconds)\" > /dns/resolv.conf && getent hosts canopy | awk '{print \"nameserver\", $1}' >> /dns/resolv.conf" ]
    networks:
      - testhub_network
    volumes:
      - dns-config:/dns
    depends_on:
      - canopy

  docker-tiger-proxy:
    container_name: docker-tiger-proxy
    image: gematik1/tiger-proxy-image:4.4.5
    platform: linux/amd64
    profiles: [ "full", "ps-only", "backend-only" ]
    env_file:
      - path: .env
        required: true
    environment:
      <<: *no-proxy-env
      SPRING_CONFIG_LOCATION: "file:/app/tiger-config/"
    networks:
      - testhub_network
    ports:
      - "${PORT_BACKEND_TIGER_PROXY:?PORT_BACKEND_TIGER_PROXY missing – set it in infra/docker/.env}:8080"
      - "${PORT_BACKEND_TIGER_PROXY_ADMIN:?PORT_BACKEND_TIGER_PROXY_ADMIN missing – set it in infra/docker/.env}:9090"
    volumes:
      - ./remoteTigerProxy:/app/tiger-config:ro

  docker-tiger-proxy-b:
    container_name: docker-tiger-proxy-b
    image: gematik1/tiger-proxy-image:4.4.2
    platform: linux/amd64
    profiles: [ "ip_bindung_on_demand" ]
    env_file:
      - path: .env
        required: true
    environment:
      <<: *no-proxy-env
      SPRING_CONFIG_LOCATION: "file:/app/tiger-config/"
    networks:
      - testhub_network
    ports:
      - "${PORT_BACKEND_TIGER_PROXY_B:?PORT_BACKEND_TIGER_PROXY_B missing – set it in infra/docker/.env}:8080"
      - "${PORT_BACKEND_TIGER_PROXY_B_ADMIN:?PORT_BACKEND_TIGER_PROXY_B_ADMIN missing – set it in infra/docker/.env}:9090"
    volumes:
      - ./remoteTigerProxy:/app/tiger-config:ro

  canopy:
    container_name: tiger-canopy
    image: docker.io/gematik1/tiger-canopy-image:4.4.5
    platform: linux/amd64
    profiles: [ "full", "ps-only", "backend-only" ]
    environment:
      SPRING_APPLICATION_JSON: |
        {
          "canopy": {
            "dnsPort": 53,
            "tigerProxyUrl": "http://docker-tiger-proxy:9090/",
            "controlMode": "NONE",
            "proxiedHosts": [
              {"host": "popp.dev.poppservice.de", "matchType": "EXACT"},
              {"host": "popp.test.poppservice.de", "matchType": "EXACT"},
              {"host": "popp.ref.poppservice.de", "matchType": "EXACT"},
              {"host": "vsdm-dev.tk.de", "matchType": "EXACT"},
              {"host": "vsdm-test.tk.de", "matchType": "EXACT"},
              {"host": "vsdm-ref.tk.de", "matchType": "EXACT"},
              {"host": "dienst.vsdd2.rudev.service-ti.de", "matchType": "EXACT"},
              {"host": "dienst.vsdd2.tu.service-ti.de", "matchType": "EXACT"},
              {"host": "dienst.vsdd2.ru.service-ti.de", "matchType": "EXACT"},
              {"host": "vsdm-rudev.apimisc.de", "matchType": "EXACT"},
              {"host": "vsdm-tu.apimisc.de", "matchType": "EXACT"},
              {"host": "vsdm-ru.apimisc.de", "matchType": "EXACT"},
              {"host": "card-terminal-client", "matchType": "EXACT"},
              {"host": "popp-client", "matchType": "EXACT"},
              {"host": "popp-server", "matchType": "EXACT"},
              {"host": "popp-token-generator", "matchType": "EXACT"},
              {"host": "popp-zeta-ingress", "matchType": "EXACT"},
              {"host": "vsdm-client", "matchType": "EXACT"},
              {"host": "vsdm-server", "matchType": "EXACT"},
              {"host": "vsdm-zeta-ingress", "matchType": "EXACT"}
            ]
          }
        }
    networks:
      - testhub_network
    ports:
      - "${PORT_CANOPY:-8080}:8080"

  # ==================== Default (via tiger-proxy) ====================

  card-terminal-client:
    profiles: [ "full", "ps-only" ]
    extends:
      service: card-terminal-client-base
    networks:
      - testhub_network
    volumes:
      - type: volume
        source: dns-config
        target: /etc/resolv.conf
        read_only: true
        volume:
          subpath: resolv.conf
    depends_on:
      resolv-writer:
        condition: service_completed_successfully

  vsdm-client:
    profiles: [ "full", "ps-only" ]
    extends:
      service: vsdm-client-base
    environment:
      - VSDM_USE_MOCK_POPP_TOKEN=${VSDM_USE_MOCK_POPP_TOKEN:-false}
    networks:
      - testhub_network
    volumes:
      - ./backend/zeta/smcb-private/${SMCB_FILE:-smcb_private.p12}:/tmp/zeta/smcb_private.p12:ro
      - type: volume
        source: dns-config
        target: /etc/resolv.conf
        read_only: true
        volume:
          subpath: resolv.conf
    depends_on:
      popp-client:
        condition: service_healthy
      resolv-writer:
        condition: service_completed_successfully

volumes:
  dns-config:

networks:
  testhub_network:

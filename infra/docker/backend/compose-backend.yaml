name: "testhub-backend"

include:
  - path: ./compose-popp-services.yaml
    project_directory: .
  - path: ./compose-vsdm-services.yaml
    project_directory: .

services:
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib
    pull_policy: if_not_present
    platform: linux/amd64
    profiles: [ "full", "backend-only", "ps-only" ]
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    env_file:
      - path: ../.env
        required: true
    networks:
      testhub_network:
    ports:
      - "${PORT_OTEL_COLLECTOR:?PORT_OTEL_COLLECTOR missing – set it in infra/docker/.env}:4318"
      - "${PORT_OTEL_COLLECTOR_GRPC:?PORT_OTEL_COLLECTOR_GRPC missing – set it in infra/docker/.env}:4317"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - prometheus

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    pull_policy: if_not_present
    platform: linux/amd64
    profiles: [ "full", "backend-only", "ps-only" ]
    command:
      - '--config.file=/etc/prometheus/config.yaml'
      - '--web.listen-address=:7100'
    env_file:
      - path: ../.env
        required: true
    networks:
      testhub_network:
    ports:
      - "${PORT_PROMETHEUS:?PORT_PROMETHEUS missing – set it in infra/docker/.env}:7100"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus

  grafana:
    container_name: grafana
    image: grafana/grafana
    pull_policy: if_not_present
    platform: linux/amd64
    profiles: [ "full", "backend-only" ]
    env_file:
      - path: ../.env
        required: true
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_PASSWORD_MUST_CHANGE=false
    networks:
      testhub_network:
    ports:
      - "${PORT_GRAFANA:?PORT_GRAFANA missing – set it in infra/docker/.env}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  testhub_network:

zeta:
  server:
    popp:
      url: "http://${ports.host}:8081"
    poppClient:
      url: "http://${ports.host}:8081"
    poppTokenGenerator:
      url: "http://${ports.host}:${ports.poppTokenGeneratorPort}"
    pdp:
      tokenUrl: "https://vsdm-test.tk.de/auth/realms/zeta-guard/protocol/openid-connect/token"
      issuer: "https://vsdm-test.tk.de/auth/realms/zeta-guard"
      realmUrl: "https://vsdm-test.tk.de/auth/realms/zeta-guard"
      dcrUrl: "https://vsdm-test.tk.de/auth/realms/zeta-guard/clients-registrations/openid-connect"
      jwksUrl: "https://vsdm-test.tk.de/auth/realms/zeta-guard/protocol/openid-connect/certs"
      nonceUrl: "https://vsdm-test.tk.de/auth/realms/zeta-guard/zeta-guard-nonce"
      smcbAudience: "https://vsdm-test.tk.de/auth/"
      clientAssertionAud: "https://vsdm-test.tk.de/auth/realms/zeta-guard/protocol/openid-connect/token"
      tokenExchangeAudience: "https://vsdm-test.tk.de"
    pep:
      url: "https://vsdm-test.tk.de/"
    opa:
      baseUrl: "http://${ports.host}:2401"
  timeouts:
    httpRequestSeconds: 10
    healthCheckSeconds: 20
    healthCheckPollIntervalMs: 250
    wsConnectionSeconds: 10
    wsMessageSeconds: 10

zeta_base_url: "popp.test.poppservice.de"

smoke:
  endpoints:
    poppZetaPdp:
      url: http://${ports.host}:${ports.poppPdpPort}/auth/realms/zeta-guard/.well-known/openid-configuration
      path: /auth/realms/zeta-guard/.well-known/openid-configuration
      name: PoPP ZeTA PDP
    poppZetaPep:
      url: http://${ports.host}:${ports.poppPepPort}/.well-known/oauth-protected-resource
      path: /.well-known/oauth-protected-resource
      name: PoPP ZeTA PEP
    poppZetaIngress:
      url: https://${ports.host}:${ports.poppZetaIngressPort}/.well-known/oauth-protected-resource
      path: /.well-known/oauth-protected-resource
      name: PoPP ZETA Ingress
    vsdmZetaIngress:
      url: https://${ports.host}:${ports.vsdmIngressPort}/.well-known/oauth-protected-resource
      path: /.well-known/oauth-protected-resource
      name: VSDM ZeTA Ingress
    vsdmZetaPep:
      url: http://${ports.host}:${ports.vsdmPepPort}/.well-known/oauth-protected-resource
      path: /.well-known/oauth-protected-resource
      name: VSDM ZeTA PEP
    vsdmZetaPdp:
      url: http://${ports.host}:${ports.vsdmPdpPort}/auth/realms/zeta-guard/.well-known/openid-configuration
      path: /auth/realms/zeta-guard/.well-known/openid-configuration
      name: VSDM ZeTA PDP

zeta:
  server:
    popp:
      url: http://${ports.host}:${ports.poppTokenGeneratorPort}
    poppClient:
      url: http://${ports.host}:${ports.poppClientPort}
    poppTokenGenerator:
      url: http://${ports.host}:${ports.poppTokenGeneratorPort}
    pdp:
      tokenUrl: http://${ports.host}:${ports.poppPdpPort}/auth/realms/zeta-guard/protocol/openid-connect/token
      # Keycloak issuer – used as 'aud' in client_assertion JWTs (must match KC_HOSTNAME + realm)
      issuer: https://vsdm-zeta-ingress/auth/realms/zeta-guard
    opa:
      baseUrl: http://${ports.host}:${ports.poppOpaPort}
  timeouts:
    httpRequestSeconds: 10
    healthCheckSeconds: 20
    healthCheckPollIntervalMs: 250
    wsConnectionSeconds: 10
    wsMessageSeconds: 10

# ZETA Guard Ingress base URL (ohne Schema – wird von Tests mit https:// ergänzt)
zeta_base_url: "${ports.host}:${ports.vsdmIngressPort}"


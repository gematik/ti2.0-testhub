tigerProxy:
  activateRbelParsing: true
  additionalProxyPorts:
    - 443
  proxyRoutes:
    - from: /
      to: https://${ports.host}:${ports.poppServerPort}/
      matchForProxyType: false
      hosts:
        - ${ports.host}:${ports.poppServerPort}
        - popp-server:8443
  activateRbelParsingFor:
    - websocket
    - x509
    - asl
    - asn1

kidTokenKey: 4IVYHy721K0rnjZ8_9fnsKofs0eKhGOcqEDVo0RBZFQ
poppServiceServerUrl: https://${ports.host}:${ports.poppServerPort}

tigerProxy:
  activateRbelParsing: true
  additionalProxyPorts:
    - 443
  proxyRoutes:
    - from: /
      to: http://localhost:18443/
      matchForProxyType: false
      hosts:
        - popp-server:8443
  activateRbelParsingFor:
    - websocket
    - x509
    - asl
    - asn1


# Server configuration
server:
  port: ${SERVER_PORT:80}

# Logging configuration
logging:
  level:
    root: INFO
    com.cardterminal.simulator: DEBUG

# Card terminal configuration
card:
  terminal:
    slots: 3000
    card-image-paths:
      - attached_assets
      - cardimages
      - file:no-publish/test-data/cards
      - file:test/vsdm-testsuite/src/test/resources/private
